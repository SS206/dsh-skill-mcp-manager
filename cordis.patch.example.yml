# Example: add dsh-skill-mcp-manager to a DSH profile's cordis.patch.yml.
# Install the package into the profile first (see README):
#   dsh plugin --profile web add dsh-skill-mcp-manager
- insert:
    - id: skill-mcp-manager
      name: 'dsh-skill-mcp-manager'
      config:
        dataDir: ''        # empty = ~/.dsh/skill-mcp-manager (or $DSH_HOME/skill-mcp-manager)
        # Profile whose cordis.patch.yml this plugin reconciles against.
        # '' / 'auto' = follow the profile this host booted (recommended: the
        # plugin then manages the profile it is installed into, including DSH
        # Desktop, which passes the profile directory positionally and never
        # sets --profile). A name pins the target; the settings page can switch
        # it at runtime and stores the choice in settings.json.
        profile: ''
        trialTimeoutMs: 30000
        toolCallTimeoutMs: 60000
        catalogDescriptionMaxLength: 500
        toolDescriptionMaxLength: 150  # per-tool description truncation in the catalog
        importNativeMcp: true  # import native dsh-mcp-client rows into the capability library (default on-demand) and take them over
